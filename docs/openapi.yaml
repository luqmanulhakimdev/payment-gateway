openapi: 3.1.0
info:
  title: Payment Gateway API
  version: 0.1.0
  description: Initial service contract. Business endpoints will be added with their implementation.
servers:
  - url: http://localhost:8081
paths:
  /readyz:
    get:
      operationId: readinessCheck
      summary: Check database readiness
      responses:
        '200':
          description: Database is reachable
          content:
            text/plain:
              schema:
                type: string
              example: ready
        '503':
          description: Database is unavailable
  /healthz:
    get:
      operationId: healthCheck
      summary: Check process health
      responses:
        '200':
          description: The HTTP process is running
          content:
            text/plain:
              schema:
                type: string
              example: ok
